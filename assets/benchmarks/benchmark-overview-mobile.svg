  <text x="588" y="715" fill="#aaa99f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end">13% more</text>
  <rect x="170" y="733" width="94" height="18" fill="#77766f"/>
  <rect x="166" y="738" width="8" height="8" fill="#fffef8"/>

  <text x="144" y="834" fill="#8f8e85" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">MORE TOKENS</text>
  <text x="264" y="834" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0</text>
  <text x="552" y="834" fill="#c9ff36" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FEWER TOKENS</text>

  <text x="34" y="918" fill="#8f8e85" font-family="Arial, Helvetica, sans-serif" font-size="12">Rounded figures. Full scores and methods are linked below.</text>
</svg>
