<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">Measured stats across Terminal-Bench and DeepSWE</title>
  <desc id="desc">CodexZero Max recorded 40 percent fewer tokens, CodexZero Safe 26 percent fewer, RTK 8 percent fewer, standard Codex is the zero percent baseline, Caveman used 2 percent more, and RTK plus Caveman used 13 percent more.</desc>

  <rect width="640" height="960" fill="#171713"/>
  <text x="34" y="58" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">Measured stats across</text>
  <text x="34" y="98" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">Terminal-Bench + DeepSWE</text>
  <text x="34" y="134" fill="#aaa99f" font-family="Arial, Helvetica, sans-serif" font-size="14">Highest recorded reduction across completed benchmarks</text>

  <rect x="24" y="168" width="592" height="704" fill="#20201c" stroke="#4a4a42"/>
  <line x1="264" y1="204" x2="264" y2="804" stroke="#fffef8" stroke-width="2"/>
  <line x1="168" y1="204" x2="168" y2="804" stroke="#3d3d36" stroke-dasharray="4 6"/>
  <line x1="360" y1="204" x2="360" y2="804" stroke="#3d3d36" stroke-dasharray="4 6"/>
  <line x1="456" y1="204" x2="456" y2="804" stroke="#3d3d36" stroke-dasharray="4 6"/>
  <line x1="552" y1="204" x2="552" y2="804" stroke="#3d3d36" stroke-dasharray="4 6"/>

  <rect x="36" y="214" width="568" height="84" fill="#29321b"/>
  <rect x="36" y="214" width="6" height="84" fill="#c9ff36"/>
  <text x="52" y="247" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">CodexZero Max</text>
  <text x="588" y="249" fill="#c9ff36" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" text-anchor="end">40% fewer</text>
  <rect x="264" y="267" width="288" height="18" fill="#aeea16"/>
  <rect x="548" y="272" width="8" height="8" fill="#fffef8"/>

  <rect x="36" y="306" width="568" height="84" fill="#24201d"/>
  <rect x="36" y="306" width="6" height="84" fill="#d94f35"/>
  <text x="52" y="339" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">CodexZero Safe</text>
  <text x="588" y="341" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" text-anchor="end">26% fewer</text>
  <rect x="264" y="359" width="187" height="18" fill="#d94f35"/>
  <rect x="447" y="364" width="8" height="8" fill="#fffef8"/>

  <line x1="52" y1="398" x2="588" y2="398" stroke="#3d3d36"/>
  <text x="52" y="439" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RTK</text>
  <text x="588" y="439" fill="#bba8ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end">8% fewer</text>
  <rect x="264" y="457" width="58" height="18" fill="#9b85ed"/>
  <rect x="318" y="462" width="8" height="8" fill="#fffef8"/>

  <rect x="36" y="490" width="568" height="84" fill="#fffef8"/>
  <text x="52" y="523" fill="#171713" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Regular Codex</text>
  <text x="52" y="551" fill="#68675f" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">STANDARD</text>
  <text x="588" y="525" fill="#171713" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="end">Baseline · 0%</text>
  <rect x="258" y="532" width="12" height="12" fill="#171713"/>

  <line x1="52" y1="582" x2="588" y2="582" stroke="#3d3d36"/>
  <text x="52" y="623" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Caveman</text>
  <text x="588" y="623" fill="#aaa99f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end">2% more</text>
  <rect x="250" y="641" width="14" height="18" fill="#77766f"/>
  <rect x="246" y="646" width="8" height="8" fill="#fffef8"/>

  <line x1="52" y1="674" x2="588" y2="674" stroke="#3d3d36"/>
