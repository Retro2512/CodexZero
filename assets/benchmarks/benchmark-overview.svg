<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Measured stats across Terminal-Bench and DeepSWE</title>
  <desc id="desc">CodexZero Max recorded 40 percent fewer tokens, CodexZero Safe 26 percent fewer, RTK 8 percent fewer, standard Codex is the zero percent baseline, Caveman used 2 percent more, and RTK plus Caveman used 13 percent more.</desc>

  <rect width="1200" height="700" fill="#171713"/>

  <text x="58" y="70" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">Measured stats across Terminal-Bench + DeepSWE</text>
  <text x="58" y="105" fill="#aaa99f" font-family="Arial, Helvetica, sans-serif" font-size="15">Highest recorded reduction for each setup across completed benchmarks</text>

  <rect x="40" y="142" width="1120" height="486" fill="#20201c" stroke="#4a4a42"/>
  <text x="72" y="181" fill="#8f8e85" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">SETUP</text>
  <text x="530" y="181" fill="#8f8e85" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" text-anchor="middle">STANDARD CODEX</text>
  <text x="1108" y="181" fill="#8f8e85" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" text-anchor="end">RESULT</text>

  <line x1="530" y1="196" x2="530" y2="590" stroke="#fffef8" stroke-width="2"/>
  <line x1="415" y1="196" x2="415" y2="590" stroke="#3d3d36" stroke-dasharray="4 6"/>
  <line x1="645" y1="196" x2="645" y2="590" stroke="#3d3d36" stroke-dasharray="4 6"/>
  <line x1="760" y1="196" x2="760" y2="590" stroke="#3d3d36" stroke-dasharray="4 6"/>
  <line x1="875" y1="196" x2="875" y2="590" stroke="#3d3d36" stroke-dasharray="4 6"/>
  <line x1="990" y1="196" x2="990" y2="590" stroke="#3d3d36" stroke-dasharray="4 6"/>

  <rect x="54" y="202" width="1092" height="58" fill="#29321b"/>
  <rect x="54" y="202" width="6" height="58" fill="#c9ff36"/>
  <text x="72" y="238" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">CodexZero Max</text>
  <rect x="530" y="220" width="450" height="22" fill="#aeea16"/>
  <rect x="975" y="226" width="10" height="10" fill="#fffef8"/>
  <text x="1124" y="238" fill="#c9ff36" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" text-anchor="end">40% fewer</text>

  <rect x="54" y="266" width="1092" height="58" fill="#24201d"/>
  <rect x="54" y="266" width="6" height="58" fill="#d94f35"/>
  <text x="72" y="302" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">CodexZero Safe</text>
  <rect x="530" y="284" width="293" height="22" fill="#d94f35"/>
  <rect x="818" y="290" width="10" height="10" fill="#fffef8"/>
  <text x="1124" y="302" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" text-anchor="end">26% fewer</text>

  <line x1="72" y1="330" x2="1128" y2="330" stroke="#3d3d36"/>
  <text x="72" y="366" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RTK</text>
