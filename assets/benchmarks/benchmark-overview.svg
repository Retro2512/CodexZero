  <line x1="72" y1="522" x2="1128" y2="522" stroke="#3d3d36"/>
  <text x="72" y="558" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RTK + Caveman</text>
  <rect x="384" y="540" width="146" height="20" fill="#77766f"/>
  <rect x="380" y="546" width="8" height="8" fill="#fffef8"/>
  <text x="1124" y="558" fill="#aaa99f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="end">13% more</text>

  <text x="336" y="610" fill="#8f8e85" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">MORE TOKENS</text>
  <text x="530" y="610" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0</text>
  <text x="980" y="610" fill="#c9ff36" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FEWER TOKENS</text>

  <text x="58" y="668" fill="#8f8e85" font-family="Arial, Helvetica, sans-serif" font-size="12">Rounded figures. Full task scores, benchmark scope, and methods are linked below.</text>
