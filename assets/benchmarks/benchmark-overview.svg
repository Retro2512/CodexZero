  <rect x="54" y="394" width="1092" height="58" fill="#fffef8"/>
  <text x="72" y="430" fill="#171713" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">Regular Codex</text>
  <text x="224" y="430" fill="#68675f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">STANDARD</text>
  <rect x="523" y="416" width="14" height="14" fill="#171713"/>
  <text x="1124" y="430" fill="#171713" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" text-anchor="end">Baseline · 0%</text>

  <line x1="72" y1="458" x2="1128" y2="458" stroke="#3d3d36"/>
  <text x="72" y="494" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Caveman</text>
