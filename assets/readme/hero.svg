<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">CodexZero. Fewer wasted tokens.</title>
  <desc id="d">CodexZero uses 15 percent fewer tokens with the same score in the repeated benchmark.</desc>
  <rect width="1200" height="440" rx="16" fill="#171713"/>

  <g transform="translate(64 46) scale(.62)" aria-hidden="true">
    <ellipse cx="32" cy="32" rx="9.5" ry="15" fill="none" stroke="#c9ff36" stroke-width="5"/>
    <path d="M9 18 L17 32 L9 46" fill="none" stroke="#f4f2e9" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 18 L47 32 L55 46" fill="none" stroke="#ff7759" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="112" y="77" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="-.2">CodexZero</text>

  <text x="64" y="192" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" letter-spacing="-2.4">Codex, with fewer</text>
  <text x="64" y="262" fill="#c9ff36" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" letter-spacing="-2.4">wasted tokens.</text>

  <text x="64" y="310" fill="#d8d6cb" font-family="Arial,Helvetica,sans-serif" font-size="21">Custom models. Live costs. Automatic cache warming.</text>

  <g transform="translate(64 344)">
    <rect x="0" y="0" width="734" height="60" rx="8" fill="#20201c" stroke="#3d3d36"/>
    <text x="24" y="39" fill="#c9ff36" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800">15% fewer tokens</text>
    <line x1="300" y1="16" x2="300" y2="44" stroke="#3d3d36"/>
    <text x="710" y="38" fill="#aaa99f" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="end">Same benchmark score: 29/36</text>
  </g>

  <g transform="translate(905 128) scale(3.05)" opacity=".95" aria-hidden="true">
    <ellipse cx="32" cy="32" rx="9.5" ry="15" fill="none" stroke="#c9ff36" stroke-width="5"/>
    <path d="M9 18 L17 32 L9 46" fill="none" stroke="#f4f2e9" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 18 L47 32 L55 46" fill="none" stroke="#ff7759" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
