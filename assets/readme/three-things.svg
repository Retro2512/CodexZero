<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="t d">
  <title id="t">Three things CodexZero does</title>
  <desc id="d">Less repeated output. Matching benchmark scores. Custom models, a cost counter and a cache warmer.</desc>
  <rect width="1200" height="290" rx="16" fill="#171713"/>

  <g>
    <rect x="24" y="24" width="368" height="242" rx="12" fill="#20201c" stroke="#3d3d36"/>
    <circle cx="64" cy="66" r="20" fill="none" stroke="#c9ff36" stroke-width="2.5"/>
    <path d="M64 56 L64 76 M56 68 L64 76 L72 68" fill="none" stroke="#c9ff36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="74" fill="#c9ff36" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800">Fewer tokens</text>
    <text x="52" y="126" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">CodexZero condenses repeated lines</text>
    <text x="52" y="150" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">in command output before Codex</text>
    <text x="52" y="174" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">reads them.</text>
  </g>

  <g>
    <rect x="416" y="24" width="368" height="242" rx="12" fill="#20201c" stroke="#3d3d36"/>
    <circle cx="456" cy="66" r="20" fill="none" stroke="#f4f2e9" stroke-width="2.5"/>
    <path d="M447 66 L453 73 L466 59" fill="none" stroke="#f4f2e9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="492" y="74" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800">Same score</text>
    <text x="444" y="126" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">Codex and CodexZero each scored</text>
    <text x="444" y="150" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">29/36 across 12 tasks run three times.</text>
    <text x="444" y="174" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">CodexZero used 14.63% fewer tokens.</text>
  </g>

  <g>
    <rect x="808" y="24" width="368" height="242" rx="12" fill="#20201c" stroke="#3d3d36"/>
    <circle cx="848" cy="66" r="20" fill="none" stroke="#ff7759" stroke-width="2.5"/>
    <path d="M848 56 L848 76 M838 66 L858 66" fill="none" stroke="#ff7759" stroke-width="2.8" stroke-linecap="round"/>
    <text x="884" y="74" fill="#ff7759" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800">More features</text>
    <text x="836" y="126" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">Claude, Z.ai and your own local models</text>
    <text x="836" y="150" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">in the Codex dropdown. Live cost per</text>
    <text x="836" y="174" fill="#f4f2e9" font-family="Arial,Helvetica,sans-serif" font-size="16">chat. A cache that keeps itself warm.</text>
  </g>
</svg>
