<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CodexZero uses fewer tokens with the same task score</title>
  <desc id="desc">CodexZero used 15 percent fewer tokens and matched Codex's task score in a repeated benchmark.</desc>
  <defs>
    <linearGradient id="czCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b1adff"/>
      <stop offset="1" stop-color="#3a47ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#171713"/>
  <g transform="translate(62 58) scale(0.6875)">
    <path d="M19.76 6.58A16.21 16.21 0 0 1 44.24 6.58A16.21 16.21 0 0 1 59.5 25.72A16.21 16.21 0 0 1 54.06 49.59A16.21 16.21 0 0 1 32 60.21A16.21 16.21 0 0 1 9.94 49.59A16.21 16.21 0 0 1 4.5 25.72A16.21 16.21 0 0 1 19.76 6.58Z" fill="url(#czCloud)"/>
    <ellipse cx="32" cy="32" rx="6.84" ry="10.8" fill="none" stroke="#fff" stroke-width="3.6"/>
