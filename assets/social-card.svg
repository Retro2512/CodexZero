<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CodexZero Safe matched stock Codex on Terminal-Bench</title>
  <desc id="desc">CodexZero Safe and stock Codex both scored 7 of 10 scorable tasks. Safe used 7.65 percent less API-equivalent cost in this paired mini-panel.</desc>
  <rect width="1200" height="630" fill="#f4f2e9"/>
  <rect width="1200" height="16" fill="#c9ff36"/>

  <rect x="62" y="54" width="54" height="54" fill="#171713"/>
  <path d="M73 69h22L84 81l11 12H73l11-12z" fill="#c9ff36"/>
  <rect x="98" y="69" width="8" height="24" fill="#ff7759"/>
  <text x="130" y="91" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#171713">CodexZero</text>
  <text x="1137" y="87" text-anchor="end" font-family="monospace" font-size="16" fill="#68675f">TERMINAL-BENCH 2.1 MINI-PANEL</text>

  <text x="62" y="197" font-family="Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-5" fill="#171713">Safe matched Codex</text>
  <text x="62" y="247" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#68675f">same result on every scorable task</text>

  <rect x="62" y="305" width="610" height="72" fill="#bba8ff"/>
  <text x="86" y="350" font-family="monospace" font-size="17" fill="#171713">CODEX</text>
  <text x="642" y="354" text-anchor="end" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#171713">7 / 10</text>

  <rect x="62" y="393" width="610" height="72" fill="#c9ff36"/>
  <text x="86" y="438" font-family="monospace" font-size="17" fill="#171713">CODEXZERO SAFE</text>
  <text x="642" y="442" text-anchor="end" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#171713">7 / 10</text>

  <rect x="735" y="150" width="403" height="315" fill="#171713"/>
  <text x="770" y="194" font-family="monospace" font-size="15" fill="#bba8ff">OBSERVED API-EQUIVALENT COST</text>
  <text x="762" y="318" font-family="Arial, sans-serif" font-size="91" font-weight="800" letter-spacing="-6" fill="#c9ff36">−7.65%</text>
  <text x="770" y="365" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f4f2e9">CodexZero Safe</text>
  <text x="770" y="410" font-family="monospace" font-size="15" fill="#aaa99f">$4.0756 VS $4.4133</text>

  <text x="62" y="537" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#ff7759">72 final cells · 84 attempts retained</text>
  <text x="62" y="584" font-family="monospace" font-size="15" fill="#68675f">TOKENS · CACHE · CALLS · TURNS · TIME · COST · TELEMETRY</text>
  <text x="1138" y="584" text-anchor="end" font-family="monospace" font-size="12" fill="#68675f">PAIRED EFFICIENCY CI INCLUDES ZERO</text>
</svg>
