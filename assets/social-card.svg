    <path d="M48.56 21.92 L42.8 32 L48.56 42.08" fill="none" stroke="#fff" stroke-width="3.96" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="124" y="92" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">CodexZero</text>

  <text x="62" y="205" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">15% fewer tokens.</text>
  <text x="62" y="277" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">Same task score.</text>
  <text x="62" y="331" fill="#b8b7ae" font-family="Arial, Helvetica, sans-serif" font-size="22">Repeated benchmark · 12 software tasks · three runs each</text>

  <text x="62" y="430" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">REGULAR CODEX</text>
