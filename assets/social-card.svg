<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CodexZero uses fewer tokens with the same task score</title>
  <desc id="desc">CodexZero used 15 percent fewer tokens and matched Codex's task score in a repeated benchmark.</desc>
  <rect width="1200" height="630" fill="#171713"/>
  <rect x="62" y="58" width="44" height="44" fill="#fffef8"/>
  <path d="M70 66h28L84 80zM70 102h28L84 88z" fill="#c9ff36"/>
  <rect x="92" y="66" width="7" height="36" fill="#d94f35"/>
  <text x="124" y="92" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">CodexZero</text>

  <text x="62" y="205" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">15% fewer tokens.</text>
  <text x="62" y="277" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">Same task score.</text>
  <text x="62" y="331" fill="#b8b7ae" font-family="Arial, Helvetica, sans-serif" font-size="22">Repeated benchmark · 12 software tasks · three runs each</text>

  <text x="62" y="430" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">REGULAR CODEX</text>
  <rect x="250" y="407" width="720" height="30" rx="15" fill="#fffef8"/>
  <text x="1110" y="431" fill="#fffef8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="end">26.58M</text>

  <text x="62" y="501" fill="#c9ff36" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">CODEXZERO</text>
  <rect x="250" y="478" width="720" height="30" rx="15" fill="#3d3d36"/>
  <rect x="250" y="478" width="615" height="30" rx="15" fill="#c9ff36"/>
  <text x="1110" y="502" fill="#c9ff36" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="end">22.69M</text>

  <rect x="62" y="558" width="1076" height="2" fill="#3d3d36"/>
  <text x="62" y="595" fill="#b8b7ae" font-family="Arial, Helvetica, sans-serif" font-size="16">Free and open source · installs beside Codex</text>
</svg>
