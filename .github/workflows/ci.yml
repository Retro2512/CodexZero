name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wrapper:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node bin/codex-zero.mjs savings --json

  patch:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify patch applies to its pinned Codex tag
        shell: bash
        run: |
          git clone --depth 1 --branch rust-v0.145.0-alpha.30 \
            https://github.com/openai/codex.git upstream
          git -C upstream apply --check ../patches/codex-rust-v0.145.0-alpha.30.patch
