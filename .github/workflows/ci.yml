name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  core-evidence:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.evidence.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse passing core checks only for identical inputs
        id: evidence
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
            // Only scheduling fields differ between the old and new patch job.
            function patchContract(source) {
              const normalized = source.replace(/\r/g, '');
              const header = normalized.split(/^jobs:\n/m)[0]
                .replace(/^permissions:\n  contents: read\n  actions: read\n\n/m, '');
              const job = normalized.match(/^  patch:\n([\s\S]*?)(?=^  [\w-]+:|$(?![\s\S]))/m)?.[1];
              if (!job) throw new Error('Missing patch job');
              return header + job.replace(/^    (?:needs|if):.*\n/gm, '').trimEnd();
            }
            function releaseContract(source) {
              const job = source.replace(/\r/g, '').match(/^  core:\n([\s\S]*?)(?=^  [\w-]+:|$(?![\s\S]))/m)?.[1];
              if (!job) throw new Error('Missing release core job');
              return job.trimEnd();
            }
            function coreInput(file) {
              return /^(?:patches|config|fixtures|\.cargo)\//.test(file)
                || /(?:^|\/)(?:Cargo\.(?:toml|lock)|rust-toolchain(?:\.toml)?)$/.test(file)
                || /\.rs$/.test(file)
                || /^scripts\/(?:core-upstream\.json|build-provider-local\.ps1)$/.test(file)
                || /^test\/.*(?:patch|core|upstream-pin).*\.test\.mjs$/.test(file)
                || (file.startsWith('.github/workflows/') && !['.github/workflows/ci.yml', '.github/workflows/release.yml'].includes(file));
            }
            core.setOutput('rebuild', 'true');
            try {
              const head = git('rev-parse', 'HEAD').trim();
              const currentPatch = patchContract(git('show', `${head}:.github/workflows/ci.yml`));
              const currentRelease = releaseContract(git('show', `${head}:.github/workflows/release.yml`));
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci.yml', event: 'push', status: 'success', per_page: 100
              });
              for (const run of data.workflow_runs) {
                const base = run.head_sha;
                if (!/^[a-f0-9]{40}$/.test(base) || base === head) continue;
                try {
                  git('merge-base', '--is-ancestor', base, head);
                  if (patchContract(git('show', `${base}:.github/workflows/ci.yml`)) !== currentPatch) continue;
                  if (releaseContract(git('show', `${base}:.github/workflows/release.yml`)) !== currentRelease) continue;
                  const changed = git('diff', '--name-only', '-z', base, head).split('\0').filter(Boolean);
                  if (changed.some(coreInput)) continue;
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    ...context.repo, run_id: run.id, filter: 'latest', per_page: 100
                  });
                  const verified = ['patch (windows-latest)', 'patch (ubuntu-latest)'].every(name =>
                    jobs.some(job => job.name === name && job.conclusion === 'success'));
                  if (!verified) continue;
                  core.setOutput('rebuild', 'false');
                  core.info(`Identical core inputs verified by ${run.html_url}`);
                  break;
                } catch {
                  // Missing history or evidence cannot authorize reuse.
                }
              }
            } catch (error) {
              core.info(`Core evidence unavailable; running full checks: ${error.message}`);
            }

  wrapper:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node bin/codex-zero.mjs savings --json

  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile Windows desktop setup
        shell: pwsh
        run: |
          # Release builds install and uninstall setup. This catches script errors on every push.
          New-Item -ItemType Directory -Path kit\runtime, kit\assets | Out-Null
          Copy-Item -Recurse bin, src, config, prompts, scripts -Destination kit
          Copy-Item package.json -Destination kit
          Copy-Item assets\codexzero.* -Destination kit\assets
          Copy-Item (Get-Command node).Source -Destination kit\runtime\node.exe
          & kit\scripts\build-desktop-setup.ps1 -PackageRoot kit -OutputDirectory setup-output

  patch:
    needs: core-evidence
    if: needs.core-evidence.outputs.rebuild != 'false'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Verify patch applies to its pinned Codex tag
        shell: bash
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch rust-v0.162.1 \
            https://github.com/openai/codex.git upstream
          git -C upstream apply --check ../patches/codex-rust-v0.162.1.patch
          git -C upstream apply ../patches/codex-rust-v0.162.1.patch
      - name: Check patched core and focused regressions
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_PROFILE_DEV_DEBUG: 0
          RUST_MIN_STACK: 8388608
        run: |
          manifest=upstream/codex-rs/Cargo.toml
          cargo test --locked --manifest-path "$manifest" -p codex-protocol codex_zero_turn_profile
          cargo test --locked --manifest-path "$manifest" -p codex-models-manager codex_zero_custom_context
          cargo test --locked --manifest-path "$manifest" -p codex-zero-codec
          cargo test --locked --manifest-path "$manifest" -p codex-cli codex_zero
          cargo test --locked --manifest-path "$manifest" -p codex-core codex_zero
          cargo test --locked --manifest-path "$manifest" -p codex-core exact_duplicate_result_references_only_an_active_identical_output
          cargo test --locked --manifest-path "$manifest" -p codex-core post_tool_use_feedback_output
          cargo test --locked --manifest-path "$manifest" -p codex-core exact_duplicate_repository_search_uses_active_result_reference
          cargo test --locked --manifest-path "$manifest" -p codex-core event_driven_empty_poll_waits_past_requested_interval_until_silent_exit
          cargo test --locked --manifest-path "$manifest" -p codex-core configured_code_mode_only_overrides_a_direct_model_default
          cargo test --locked --manifest-path "$manifest" -p codex-core tool_mode_selector_overrides_feature_flags
          cargo test --locked --manifest-path "$manifest" -p codex-core config_schema_matches_fixture
          cargo check --locked --manifest-path "$manifest" -p codex-cli
