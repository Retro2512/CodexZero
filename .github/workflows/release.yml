name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: CodexZero release version
        required: true
        default: 0.1.4
      reuse_core_release:
        description: Reuse cores only when patches and runtime config match this release; leave blank to rebuild
        required: false
        default: 0.1.3

permissions:
  contents: write

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
            binary: codex.exe
          - os: macos-15-intel
            asset: macos-x64
            binary: codex
          - os: macos-14
            asset: macos-arm64
            binary: codex
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: codex-zero
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.reuse_core_release == ''
      - uses: taiki-e/install-action@just
        if: inputs.reuse_core_release == ''
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reusable core lineage
        if: inputs.reuse_core_release != ''
        working-directory: codex-zero
        shell: bash
        run: |
          git fetch origin "refs/tags/v${{ inputs.reuse_core_release }}:refs/tags/v${{ inputs.reuse_core_release }}" --force
          git diff --exit-code "v${{ inputs.reuse_core_release }}" HEAD -- patches config
      - name: Download and verify reusable core package
        if: inputs.reuse_core_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="codex-zero-${{ matrix.asset }}.zip"
          else
            ARCHIVE="codex-zero-${{ matrix.asset }}.tar.gz"
          fi
          gh release download "v${{ inputs.reuse_core_release }}" \
            --repo "${{ github.repository }}" --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
          EXPECTED="$(awk '{print $1}' "$ARCHIVE.sha256")"
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          else
            ACTUAL="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          fi
          test "$ACTUAL" = "$EXPECTED"
      - name: Extract reusable Windows package
        if: inputs.reuse_core_release != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path base | Out-Null
          Expand-Archive -LiteralPath "codex-zero-${{ matrix.asset }}.zip" -DestinationPath base
      - name: Extract reusable macOS package
        if: inputs.reuse_core_release != '' && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir base
          tar -C base -xzf "codex-zero-${{ matrix.asset }}.tar.gz"
      - name: Clone pinned Codex source
        if: inputs.reuse_core_release == ''
        shell: bash
        run: |
          git clone --depth 1 --branch rust-v0.145.0-alpha.30 \
            https://github.com/openai/codex.git upstream
          git -C upstream apply ../codex-zero/patches/codex-rust-v0.145.0-alpha.30.patch
      - name: Build patched core
        if: inputs.reuse_core_release == ''
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --manifest-path upstream/codex-rs/Cargo.toml -p codex-cli --release
      - name: Assemble package
        shell: bash
        run: |
          if [ -n "${{ inputs.reuse_core_release }}" ]; then
            cp -R base package
          else
            mkdir -p "package/dist/${{ matrix.asset }}"
            if [ "${{ runner.os }}" = "Windows" ]; then
              CORE_NAME="codex-zero-core.exe"
              NODE_SOURCE="$(where.exe node | head -n 1 | tr -d '\r')"
              NODE_NAME="node.exe"
            else
              CORE_NAME="codex-zero-core"
              NODE_SOURCE="$(command -v node)"
              NODE_NAME="node"
            fi
            cp "upstream/codex-rs/target/release/${{ matrix.binary }}" \
              "package/dist/${{ matrix.asset }}/$CORE_NAME"
            mkdir -p package/runtime
            cp "$NODE_SOURCE" "package/runtime/$NODE_NAME"
          fi
          cp -R codex-zero/bin codex-zero/src codex-zero/config codex-zero/scripts package/
          cp codex-zero/package.json codex-zero/README.md codex-zero/LICENSE package/
          if [ "${{ runner.os }}" = "Windows" ]; then
            NODE_NAME="node.exe"
          else
            NODE_NAME="node"
          fi
          "package/runtime/$NODE_NAME" --version
      - name: Verify Windows installer and in-place upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codexzero-home'
          & package\scripts\install.ps1 -PackageRoot package
          & package\scripts\install.ps1 -PackageRoot package
          & "$env:CODEX_HOME\bin\codex-zero.cmd" monitor --stop
      - name: Verify macOS installer and in-place upgrade
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codexzero-home"
          sh package/scripts/install.sh package
          sh package/scripts/install.sh package
          "$CODEX_HOME/bin/codex-zero" monitor --stop
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath "codex-zero-${{ matrix.asset }}.zip"
      - name: Archive Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C package -czf "codex-zero-${{ matrix.asset }}.tar.gz" .
      - name: Write checksum
        shell: bash
        run: |
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'codex-zero-${{ matrix.asset }}.*' ! -name '*.sha256' -print -quit)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codex-zero-${{ matrix.asset }}
          path: |
            codex-zero-${{ matrix.asset }}.*

  publish:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          files: artifacts/*
