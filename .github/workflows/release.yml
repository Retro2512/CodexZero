name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: CodexZero release version
        required: true
        default: 0.9.2
      reuse_core_release:
        description: Reuse cores only when patches and runtime config match this release; leave blank to rebuild
        required: false
        default: ''
      publish:
        description: Publish the release; clear to build and verify only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  core:
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
            binary: codex.exe
          - os: macos-15-intel
            asset: macos-x64
            binary: codex
          - os: macos-14
            asset: macos-arm64
            binary: codex
          - os: ubuntu-22.04
            asset: linux-x64
            binary: codex
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: codex-zero
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        if: inputs.reuse_core_release == ''
      - uses: taiki-e/install-action@just
        if: inputs.reuse_core_release == ''
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release version and client tests
        working-directory: codex-zero
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (process.env.RELEASE_VERSION !== version) throw new Error("Release version must match package.json");'
          npm test
      - name: Verify reusable core lineage
        if: inputs.reuse_core_release != ''
        working-directory: codex-zero
        shell: bash
        run: |
          git fetch origin "refs/tags/v${{ inputs.reuse_core_release }}:refs/tags/v${{ inputs.reuse_core_release }}" --force
          git diff --exit-code "v${{ inputs.reuse_core_release }}" HEAD -- patches config
      - name: Download and verify reusable core package
        if: inputs.reuse_core_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir reusable
          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="codex-zero-${{ matrix.asset }}.zip"
          else
            ARCHIVE="codex-zero-${{ matrix.asset }}.tar.gz"
          fi
          gh release download "v${{ inputs.reuse_core_release }}" \
            --repo "${{ github.repository }}" --dir reusable \
            --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
          EXPECTED="$(awk '{print $1}' "reusable/$ARCHIVE.sha256")"
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL="$(sha256sum "reusable/$ARCHIVE" | awk '{print $1}')"
          else
            ACTUAL="$(shasum -a 256 "reusable/$ARCHIVE" | awk '{print $1}')"
          fi
          test "$ACTUAL" = "$EXPECTED"
          gh attestation verify "reusable/$ARCHIVE" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
      - name: Extract reusable Windows package
        if: inputs.reuse_core_release != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path base | Out-Null
          Expand-Archive -LiteralPath "reusable\codex-zero-${{ matrix.asset }}.zip" -DestinationPath base
      - name: Extract reusable Unix package
        if: inputs.reuse_core_release != '' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir base
          tar -C base -xzf "reusable/codex-zero-${{ matrix.asset }}.tar.gz"
      - name: Clone pinned Codex source
        if: inputs.reuse_core_release == ''
        shell: bash
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch rust-v0.153.4 \
            https://github.com/openai/codex.git upstream
          git -C upstream apply ../codex-zero/patches/codex-rust-v0.153.4.patch
      - name: Build patched core
        if: inputs.reuse_core_release == ''
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo build --locked --manifest-path upstream/codex-rs/Cargo.toml -p codex-cli --release
      - name: Assemble package
        shell: bash
        run: |
          if [ -n "${{ inputs.reuse_core_release }}" ]; then
            mkdir package
            cp -R base/dist base/runtime package/
          else
            mkdir -p "package/dist/${{ matrix.asset }}"
            if [ "${{ runner.os }}" = "Windows" ]; then
              CORE_NAME="codex-zero-core.exe"
              NODE_SOURCE="$(where.exe node | head -n 1 | tr -d '\r')"
              NODE_NAME="node.exe"
            else
              CORE_NAME="codex-zero-core"
              NODE_SOURCE="$(command -v node)"
              NODE_NAME="node"
            fi
            cp "upstream/codex-rs/target/release/${{ matrix.binary }}" \
              "package/dist/${{ matrix.asset }}/$CORE_NAME"
            mkdir -p package/runtime
            cp "$NODE_SOURCE" "package/runtime/$NODE_NAME"
          fi
          cp -R codex-zero/bin codex-zero/src codex-zero/config codex-zero/prompts codex-zero/scripts package/
          mkdir -p package/assets
          cp codex-zero/assets/provider-settings.html codex-zero/assets/native-provider-* codex-zero/assets/native-sidebar-* codex-zero/assets/native-cache-ui.mjs codex-zero/assets/model-pricing.mjs codex-zero/assets/sidebar-performance.mjs codex-zero/assets/transcript-retention.mjs codex-zero/assets/codexzero.* package/assets/
          cp codex-zero/package.json codex-zero/README.md codex-zero/LICENSE package/
          if [ "${{ runner.os }}" = "Windows" ]; then
            NODE_NAME="node.exe"
          else
            NODE_NAME="node"
          fi
          "package/runtime/$NODE_NAME" --version
          "package/runtime/$NODE_NAME" codex-zero/scripts/verify-desktop-assets.mjs package
      - name: Write release manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          PLATFORM: ${{ matrix.asset }}
        run: |
          if [ -n "${{ inputs.reuse_core_release }}" ]; then
            test -f base/release-manifest.json || { echo 'Reusable package lacks a release manifest; rebuild the core.' >&2; exit 1; }
            UPSTREAM_COMMIT="$(node -p 'require("./base/release-manifest.json").upstream.commit')"
            CORE_SOURCE_COMMIT="$(node -p 'require("./base/release-manifest.json").core.sourceCommit')"
          else
            UPSTREAM_COMMIT="$(git -C upstream rev-parse HEAD)"
            CORE_SOURCE_COMMIT="$SOURCE_COMMIT"
          fi
          node codex-zero/scripts/write-release-manifest.mjs package "$RELEASE_VERSION" "$PLATFORM" "$SOURCE_COMMIT" "$UPSTREAM_COMMIT" "$CORE_SOURCE_COMMIT"
      - name: Verify Windows installer and in-place upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codexzero-home'
          & package\scripts\install.ps1 -PackageRoot package -Mode standard -CliOnly
          & package\scripts\install.ps1 -PackageRoot package -Mode focused -CliOnly
          & package\scripts\install.ps1 -PackageRoot package -Mode max-save -CliOnly
          & package\scripts\install.ps1 -PackageRoot package -Mode safe -CliOnly
          $mode = (& "$env:CODEX_HOME\bin\codex-zero.cmd" mode).Trim()
          if ($mode -ne 'safe') { throw "Expected safe mode, got $mode" }
          & "$env:CODEX_HOME\bin\codex-zero.cmd" monitor --stop
          & package\runtime\node.exe package\scripts\verify-desktop-assets.mjs "$env:CODEX_HOME\codexzero\app"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Desktop assets failed verification' }
      - name: Verify macOS installer and in-place upgrade
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codexzero-home"
          sh package/scripts/install.sh package standard
          sh package/scripts/install.sh package focused
          sh package/scripts/install.sh package max-save
          sh package/scripts/install.sh package safe
          test "$("$CODEX_HOME/bin/codex-zero" mode)" = "safe"
          "$CODEX_HOME/bin/codex-zero" monitor --stop
          package/runtime/node package/scripts/verify-desktop-assets.mjs "$CODEX_HOME/codexzero/app"
      - name: Verify Linux CLI installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codexzero-home"
          sh package/scripts/install.sh package safe
          test "$("$CODEX_HOME/bin/codex-zero" mode)" = "safe"
          "$CODEX_HOME/bin/codex-zero" monitor --stop
          test -f "$CODEX_HOME/codexzero/app/package.json"
      - name: Verify packaged core startup
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/codexzero-home
          CODEX_ZERO_RUNTIME_OVERRIDES: '1'
          CODEX_ZERO_PROFILE: codexzero
          CODEX_ZERO_SQLITE_HOME: ${{ runner.temp }}/codexzero-home/codexzero/sqlite
        run: |
          node --input-type=module <<'JS'
          import path from 'node:path';
          import { verifyAppServer } from './package/src/desktop-startup.mjs';
          const binary = process.platform === 'win32' ? 'codex-zero-core.exe' : 'codex-zero-core';
          await verifyAppServer(path.resolve('package/dist/${{ matrix.asset }}', binary), process.env, { timeoutMs: 30000 });
          JS
      - name: Verify macOS app install, upgrade and launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          apps="$RUNNER_TEMP/Applications"
          # The first run downloads the official desktop. The second reuses it.
          for run in 1 2; do
            sh package/scripts/install-desktop-macos.sh "$PWD/package" --applications "$apps" --no-open --skip-installed
          done
          test "$(find "$apps" -maxdepth 1 -name '*.app' | wc -l | tr -d ' ')" = 1
          ls "$HOME/Library/Caches/CodexZero/desktop/"*.zip
          package/runtime/node package/scripts/verify-desktop-macos.mjs "$apps/CodexZero.app"
      - name: Build Windows desktop setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Download support in setup requires Inno Setup 6.5 or later.
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          & package\scripts\build-desktop-setup.ps1 -PackageRoot package -OutputDirectory .
      - name: Verify desktop setup, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'CodexZero Desktop Test'
          $cache = Join-Path $env:LOCALAPPDATA 'CodexZero\cache'
          # The first run downloads the official desktop. The second reuses it.
          foreach ($run in 1, 2) {
            $log = Join-Path $env:RUNNER_TEMP "setup-$run.log"
            $setup = Start-Process -FilePath (Resolve-Path 'CodexZero-Setup-windows-x64.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOLAUNCH', "/DIR=`"$target`"", "/LOG=`"$log`"" -Wait -PassThru
            if ($setup.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 60; throw "Desktop setup failed ($($setup.ExitCode))" }
            $build = Join-Path $target (Get-Content -Raw -LiteralPath "$target\current-build.txt").Trim()
            & "$build\runtime\node.exe" "$build\scripts\verify-complete-desktop.mjs" $build
            if ($LASTEXITCODE -ne 0) { throw 'Installed desktop failed verification' }
            if (!(Test-Path -Path "$cache\desktop\*.msix")) { throw 'Desktop download was not kept for updates' }
          }
          if (@(Get-ChildItem -LiteralPath "$target\updates" -Directory).Count -ne 1) { throw 'Setup kept an unused desktop build' }
          $uninstall = Start-Process -FilePath "$target\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Desktop uninstall failed' }
          foreach ($leftover in @("$target\CodexZero.exe", "$target\updates", "$target\current-build.txt", $cache)) {
            if (Test-Path -LiteralPath $leftover) { throw "Desktop uninstall left $leftover" }
          }
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath "codex-zero-${{ matrix.asset }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'CodexZero-Setup-windows-x64.exe').Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('CodexZero-Setup-windows-x64.exe.sha256', "$hash  CodexZero-Setup-windows-x64.exe`n")
      - name: Archive Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C package -czf "codex-zero-${{ matrix.asset }}.tar.gz" .
      - name: Write checksum
        shell: bash
        run: |
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'codex-zero-${{ matrix.asset }}.*' ! -name '*.sha256' -print -quit)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codex-zero-${{ matrix.asset }}
          path: |
            codex-zero-${{ matrix.asset }}.*
            CodexZero-Setup-windows-x64.exe*

  attest:
    needs: core
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*

  publish:
    needs: [core, attest]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require passing CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$RUN_ID" || { echo 'Run CI for the release commit before publishing.' >&2; exit 1; }
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CodexZero ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            * Fixed optimization settings being ignored at launch and reset during upgrades.
            * Preserved every command output line in reversible compression.
            * Added artifact permission repair and pruning.
            * Added startup checks before opening Desktop.
            * Added Linux x64 CLI packages.
            * Added release manifests, build attestations and version pinning.

            Windows, macOS and Linux x64 packages are below. [Install instructions](https://github.com/Retro2512/CodexZero#install).
          files: artifacts/*

  install-smoke:
    needs: publish
    if: inputs.publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      CODEX_ZERO_VERSION: ${{ inputs.version }}
      CODEX_ZERO_VERIFY_ATTESTATION: '1'
    steps:
      - name: Wait for the latest release
        shell: bash
        run: |
          for attempt in {1..30}; do
            latest="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)"
            if [ "$latest" = "v${{ inputs.version }}" ]; then exit 0; fi
            sleep 10
          done
          echo "The new release is not the latest release" >&2
          exit 1
      - name: Install with the published Windows command
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/${{ github.repository }}/v${{ inputs.version }}/scripts/bootstrap.ps1 | iex
          $root = Join-Path $env:LOCALAPPDATA 'Programs\CodexZero'
          $current = (Get-Content -Raw -LiteralPath (Join-Path $root 'current-build.txt')).Trim()
          $build = Join-Path $root $current
          $version = (Get-Content -Raw -LiteralPath (Join-Path $build 'package.json') | ConvertFrom-Json).version
          if ($version -ne '${{ inputs.version }}') { throw "Installed $version instead of ${{ inputs.version }}" }
      - name: Install with the published macOS command
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/v${{ inputs.version }}/scripts/bootstrap.sh | sh
          app="$HOME/Applications/CodexZero.app"
          test -d "$app"
          installed="$(node -p 'require(process.argv[1]).version' "$app/Contents/Resources/codexzero/package.json")"
          test "$installed" = '${{ inputs.version }}'
      - name: Install with the published Linux command
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          export CODEX_HOME="$RUNNER_TEMP/codexzero-home"
          export CODEX_ZERO_INSTALL_MODE=safe
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/v${{ inputs.version }}/scripts/bootstrap.sh | sh
          test "$("$CODEX_HOME/bin/codex-zero" mode)" = safe
          "$CODEX_HOME/bin/codex-zero" monitor --stop
